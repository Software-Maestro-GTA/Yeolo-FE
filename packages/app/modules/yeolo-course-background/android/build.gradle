plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.yeolocoursebackground'
version = '1.0.0'
android {
  namespace 'expo.modules.yeolocoursebackground'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'expo.modules.yeolocoursebackground.CourseBackgroundVerification'
  }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
}
